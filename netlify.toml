[build]
  # React SPA en client/dist/ + assets estáticos (imágenes, CSS) en client/dist/assets/
  command   = "npm run client:install && npm run client:build && cp -r assets client/dist/assets"
  publish   = "client/dist"

[build.environment]
  NODE_VERSION = "20"

# ── Proxy API → Render/backend ───────────────────────────────────────────────
[[redirects]]
  from   = "/api/*"
  to     = "https://api.ocho.com.ar/api/:splat"
  status = 200
  force  = true

# ── React SPA: todas las rutas van al index.html de React ────────────────────
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
