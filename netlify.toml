[build]
  # 1. Instala y buildea el cliente React (sale en client/dist/app/)
  # 2. Copia el index.html estático (landing) a client/dist/
  # 3. Copia los assets estáticos (CSS, imágenes) a client/dist/assets/
  command   = "npm run client:install && npm run client:build && cp index.html client/dist/index.html && cp -r assets client/dist/assets"
  publish   = "client/dist"

[build.environment]
  NODE_VERSION = "20"

# ── Proxy API → Render/backend ───────────────────────────────────────────────
[[redirects]]
  from   = "/api/*"
  to     = "https://api.ocho.com.ar/api/:splat"
  status = 200
  force  = true

# ── React SPA: todas las rutas bajo /app/* ───────────────────────────────────
[[redirects]]
  from   = "/app/*"
  to     = "/app/index.html"
  status = 200

# ── / sirve client/dist/index.html (landing estática) automáticamente ────────
# No se necesita redirect: Netlify sirve index.html para / por defecto
